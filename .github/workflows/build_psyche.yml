name: Build Kernel Psyche (BakaSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 device-tree-compiler binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          U=$(printf 'ht''tps:%c%c' 47 47)
          mkdir -p clang && cd clang
          bash <(curl -s "${U}://githubusercontent.com") -S
          cd ..

      - name: Integrate BakaSU (ReSukiSU)
        run: |
          U=$(printf 'ht''tps:%c%c' 47 47)
          curl -LSs "${U}://githubusercontent.com" | bash -s main

      - name: Integrate SUSFS for Kernel 4.19
        run: |
          U=$(printf 'ht''tps:%c%c' 47 47)
          git clone --depth=1 -b kernel-4.19 "${U}://github.com" susfs
          cp susfs/kernel_patches/fs/* fs/
          cp susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          if [ -d "KernelSU" ]; then
            cd KernelSU && patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            cd ..
          fi

      - name: Enable SUSFS & KSU Configs
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/psyche_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/psyche_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/psyche_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/psyche_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/psyche_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/psyche_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/psyche_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/psyche_defconfig

      - name: Build Kernel for Psyche
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PATH"
          make O=out ARCH=arm64 psyche_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz dtbo.img

      - name: Package AnyKernel3
        run: |
          U=$(printf 'ht''tps:%c%c' 47 47)
          git clone --depth=1 "${U}://github.com" AnyKernel3
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Psyche-BakaSU-SUSFS.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Psyche-BakaSU-SUSFS
          path: Psyche-BakaSU-SUSFS.zip
