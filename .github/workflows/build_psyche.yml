name: Build Kernel Psyche (ReSukiSU/BakaSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 device-tree-compiler

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang && cd clang
          bash <(curl -s "https://githubusercontent.com") -S
          cd ..

      - name: Integrate ReSukiSU / BakaSU
        run: |
          curl -LSs "https://githubusercontent.com" | bash -s main

      - name: Build Kernel for Psyche
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PATH"
          make O=out ARCH=arm64 psyche_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz dtbo.img

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com AnyKernel3
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Psyche-BakaSU-Kernel.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Psyche-BakaSU-Kernel
          path: Psyche-BakaSU-Kernel.zip
